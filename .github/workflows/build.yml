name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release job

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # No SDK setup step on purpose: the whole point is that this builds with the C#
      # compiler that already ships inside Windows, which the runner image also has.
      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Sanity-check the binary
        shell: pwsh
        run: |
          $f = Get-Item .\PipDimmer.exe
          Write-Host ("PipDimmer.exe: {0:N0} bytes" -f $f.Length)
          if ($f.Length -lt 20000) { throw "binary is suspiciously small ($($f.Length) bytes)" }
          $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "not a PE image" }

      - name: Compare the committed binary with a fresh build
        shell: pwsh
        run: |
          # A fresh build is never byte-identical -- the compiler stamps a new MVID and
          # timestamp into the PE every time -- so hashing would warn on every single run and
          # train everyone to ignore it. Size is stable, and a size change is a real signal
          # that the committed exe no longer matches src/.
          $fresh = (Get-Item .\PipDimmer.exe).Length
          $committed = [int](git cat-file -s (git rev-parse 'HEAD:PipDimmer.exe'))
          Write-Host "committed: $committed bytes, fresh build: $fresh bytes"
          if ($committed -ne $fresh) {
            Write-Host "::warning::PipDimmer.exe in the repo looks stale - run build.ps1 and commit the result"
          } else {
            Write-Host "committed binary has the same size as a fresh build (contents are not compared)"
          }

      - name: Download AutoHotkey
        shell: pwsh
        run: |
          # Downloading the official zip is more predictable than a package manager: it needs
          # no install step and the layout is known.
          $ver = '2.0.19'
          $zip = Join-Path $env:RUNNER_TEMP 'ahk.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'ahk'
          Invoke-WebRequest "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$ver/AutoHotkey_$ver.zip" -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter 'AutoHotkey64.exe' | Select-Object -First 1
          if (-not $exe) { throw "AutoHotkey64.exe not found in the downloaded zip" }
          "AHK_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Validate AutoHotkey syntax and initialization
        shell: pwsh
        timeout-minutes: 2
        run: .\tests\Validate-Ahk.ps1 -AhkExePath $env:AHK_EXE

      - uses: actions/upload-artifact@v7
        with:
          name: PipDimmer
          path: PipDimmer.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          # The tag may already carry a release -- `gh release create` run locally creates the
          # tag, which then triggers this workflow. Creating it again would fail, so attach the
          # freshly built binary to whichever release is there.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag already exists, replacing its binary"
            gh release upload $tag PipDimmer.exe --clobber
          } else {
            Write-Host "creating release $tag"
            gh release create $tag PipDimmer.exe --title $tag --generate-notes
          }
